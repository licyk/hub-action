name: Clean Outdated SD Portable and Hanafubuki Releases

on:
  schedule:
  - cron: '30 15 * * *'
  # push:
  # delete:
  # create:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview Hanafubuki cleanup and skip portable cleanup
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: clean-outdated-sd-webui-all-in-one
  cancel-in-progress: false

jobs:
  Clean-Outdated-SD-Portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Config HuggingFace / ModelScope Python Library
        shell: bash
        env:
          UV_SYSTEM_PYTHON: 1
        run: |
          uv pip install "sd-webui-all-in-one[models]"

      - name: List files in the repository
        run: |
          cd "${{ github.workspace }}"
          ls "${{ github.workspace }}"

      - name: Clean Outdated SD Portable
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          HF_REPO_ID: licyk/sd-webui-all-in-one
          HF_REPO_TYPE: model
          MS_REPO_ID: licyks/sd-webui-all-in-one
          MS_REPO_TYPE: model
          DAY_THRESHOLD: 30
        run: |
          python "${{ github.workspace }}/scripts/clean_outdated_sd_portable.py"

      - name: Clean Outdated Hanafubuki Releases
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          HF_REPO_ID: licyk/sd-webui-all-in-one
          HF_REPO_TYPE: model
          MS_REPO_ID: licyks/sd-webui-all-in-one
          MS_REPO_TYPE: model
          KEEP_VERSION_COUNT: 30
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python "${{ github.workspace }}/scripts/clean_outdated_hanafubuki_releases.py"
