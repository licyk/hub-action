name: Build HF Xet Android Wheel

on:
  schedule:
    - cron: '20 16 * * *' # UTC 16:20 / 北京时间次日 00:20
  workflow_dispatch:
    inputs:
      git_ref:
        description: latest stable release, or an xet-core branch/tag/commit
        required: true
        type: string
        default: latest
      force:
        description: Rebuild all Python versions even if wheels already exist
        required: true
        type: boolean
        default: false
      upload:
        description: Upload wheels to ModelScope licyks/wheels (hf_xet/)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hf-xet-android
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      matrix: ${{ steps.check.outputs.matrix }}
      source_commit: ${{ steps.check.outputs.source_commit }}
      source_version: ${{ steps.check.outputs.source_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install repository and version tools
        env:
          UV_SYSTEM_PYTHON: '1'
        run: uv pip install 'sd-webui-all-in-one[models]' packaging

      - name: Check upstream and uploaded versions
        id: check
        env:
          HF_XET_REF: ${{ inputs.git_ref || 'latest' }}
          FORCE_BUILD: ${{ inputs.force && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: python scripts/check_hf_xet_update.py

  build:
    needs: check
    if: ${{ needs.check.outputs.should_build == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: Build Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: '27.2.12479018'
      OPENSSL_CONFIG_DIR: /data/data/com.termux/files/usr/etc/tls
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout hf-xet source
        uses: actions/checkout@v6
        with:
          repository: huggingface/xet-core
          ref: ${{ needs.check.outputs.source_commit }}
          path: xet-core
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install 'maturin==1.15.0' 'tomlkit==0.14.0'
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the obsolete SDK package "tools".
          packages: ndk;${{ env.NDK_VERSION }}
          log-accepted-android-sdk-licenses: false

      - name: Prepare Termux Python and source
        env:
          TARGET_PYTHON: ${{ matrix.python }}
          EXPECTED_VERSION: ${{ needs.check.outputs.source_version }}
        run: |
          python scripts/build_hf_xet_android.py prepare --python-version "$TARGET_PYTHON"
          python scripts/build_hf_xet_android.py patch --expected-version "$EXPECTED_VERSION"

      - name: Configure Android toolchain
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$toolchain" >> "$GITHUB_PATH"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
            echo "CXX_aarch64_linux_android=$toolchain/aarch64-linux-android${ANDROID_API_LEVEL}-clang++"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          } >> "$GITHUB_ENV"

      - name: Build wheel
        run: |
          mkdir -p dist
          # Feature changes may update the upstream lockfile; save the resolved one below.
          cargo tree --manifest-path xet-core/hf_xet/Cargo.toml \
            --target aarch64-linux-android --edges normal,build \
            --features native-tls-vendored > build/hf-xet-android/dependencies.txt
          if grep -q 'rustls-platform-verifier' build/hf-xet-android/dependencies.txt; then
            echo 'The Android JVM TLS verifier is still enabled.' >&2
            exit 1
          fi
          maturin build --manifest-path xet-core/hf_xet/Cargo.toml \
            --target aarch64-linux-android --release --locked \
            --features native-tls-vendored --out dist
          python scripts/build_hf_xet_android.py verify

      - name: Record build details
        run: |
          cp build/hf-xet-android/build-info.json dist/
          cp build/hf-xet-android/dependencies.txt dist/
          cp xet-core/hf_xet/Cargo.lock dist/Cargo.lock
          git -C xet-core diff -- Cargo.toml hf_xet/Cargo.toml > dist/termux.patch
          {
            git -C xet-core rev-parse HEAD
            rustc --version
            maturin --version
            echo "Android NDK: $NDK_VERSION"
          } > dist/toolchain.txt
          {
            echo '### hf-xet for Termux arm64'
            echo 'Built for the selected Termux Python; see build-info.json for its source, version and Android API.'
            echo 'TLS: vendored OpenSSL, using Termux certificates. Install ca-certificates in Termux.'
            echo 'Wheel metadata and ELF architecture checked; device import and Xet transfer are not tested here.'
            echo '```json'
            cat dist/build-info.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: hf-xet-termux-arm64-py${{ matrix.python }}
          path: dist/
          if-no-files-found: error

  upload:
    needs: [check, build]
    if: ${{ needs.check.outputs.should_build == 'true' && (github.event_name == 'schedule' || inputs.upload) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/download-artifact@v4
        with:
          pattern: hf-xet-termux-arm64-py*
          path: artifact

      - name: Install repository upload tools
        env:
          UV_SYSTEM_PYTHON: '1'
        run: uv pip install 'sd-webui-all-in-one[models]'

      - name: Upload hf-xet wheels
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: python scripts/upload_hf_xet_whl.py artifact
